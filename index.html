<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Guardian Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Dashboard = () => {
            const [state, setState] = useState('Idle');
            const [time, setTime] = useState(0);

            useEffect(() => {
                let interval;
                if (state === 'Studying') {
                    interval = setInterval(() => setTime(t => t + 1), 1000);
                }
                return () => clearInterval(interval);
            }, [state]);

            const formatTime = (s) => {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return `${m}:${sec.toString().padStart(2, '0')}`;
            };

            return (
                <div className="max-w-4xl mx-auto text-center">
                    <h1 className="text-3xl font-bold text-slate-800 mb-8">Nexus AI Study Dashboard</h1>
                    <div className="bg-white p-12 rounded-3xl shadow-xl inline-block min-w-[400px] border border-slate-100">
                        <div className="text-lg text-slate-500 mb-2">
                            Current Status: <span className="font-bold text-indigo-600">{state}</span>
                        </div>
                        <div className="text-7xl font-black mb-8 text-slate-800 tabular-nums">{formatTime(time)}</div>
                        {state === 'Idle' ? (
                            <button onClick={() => setState('Studying')} className="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-4 rounded-full text-xl font-bold transition-all transform hover:scale-105 shadow-lg">
                                <i className="fas fa-play mr-2"></i> Start Study Session
                            </button>
                        ) : (
                            <button onClick={() => { setState('Idle'); setTime(0); }} className="bg-rose-500 hover:bg-rose-600 text-white px-8 py-4 rounded-full text-xl font-bold transition-all transform hover:scale-105 shadow-lg">
                                <i className="fas fa-stop mr-2"></i> End Session
                            </button>
                        )}
                    </div>
                    <div className="grid grid-cols-2 gap-6 mt-12 text-left">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-slate-500 font-medium mb-2">Daily Social Media Limit</h3>
                            <div className="text-3xl font-bold text-slate-800">45 / 60 min</div>
                            <div className="w-full bg-slate-100 h-3 rounded-full mt-4 overflow-hidden">
                                <div className="bg-indigo-500 h-full w-[75%] rounded-full"></div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-slate-500 font-medium mb-2">Weekly Focus Score</h3>
                            <div className="text-3xl font-bold text-slate-800">88%</div>
                            <p className="text-slate-400 text-sm mt-2">↑ 4% from last week</p>
                        </div>
                    </div>
                </div>
            );
        };

        const Planner = () => {
            const [tasks, setTasks] = useState([
                { id: 1, subject: 'Math', task: 'Calculus Exercises', completed: false, diff: 'Hard' },
                { id: 2, subject: 'CS', task: 'Red-Black Tree', completed: true, diff: 'Medium' },
            ]);
            return (
                <div className="max-w-3xl mx-auto">
                    <h1 className="text-3xl font-bold text-slate-800 mb-8">Nexus AI Study Planner</h1>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
                        <div className="flex gap-4">
                            <input className="flex-1 p-2 border rounded-lg" placeholder="Subject" />
                            <input className="flex-[2] p-2 border rounded-lg" placeholder="Task" />
                            <button className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">Add</button>
                        </div>
                    </div>
                    <div className="space-y-3">
                        {tasks.map(t => (
                            <div key={t.id} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-indigo-500 flex items-center justify-between">
                                <div>
                                    <span className="text-xs font-bold text-slate-400 mr-2 uppercase">{t.subject}</span>
                                    <span className={t.completed ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}>{t.task}</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className="text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-600">{t.diff}</span>
                                    <input type="checkbox" checked={t.completed} readOnly className="w-5 h-5" />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Quiz = () => {
            return (
                <div className="max-w-2xl mx-auto text-center">
                    <h1 className="text-3xl font-bold text-slate-800 mb-8">Nexus AI Knowledge Check</h1>
                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                        <div className="text-sm text-slate-400 mb-4">Question 1 of 3</div>
                        <h2 className="text-xl font-bold text-slate-700 mb-6">What is the time complexity of searching in a Balanced BST?</h2>
                        <div className="grid grid-cols-1 gap-3">
                            {['O(1)', 'O(log n)', 'O(n)', 'O(n log n)'].map(opt => (
                                <button key={opt} className="p-4 text-left border rounded-xl hover:bg-indigo-50 transition-colors">{opt}</button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Recs = () => {
            return (
                <div className="max-w-4xl mx-auto">
                    <h1 className="text-3xl font-bold text-slate-800 mb-8">Nexus AI Learning Resources</h1>
                    <div className="grid grid-cols-2 gap-6">
                        {[1,2,3,4].map(i => (
                            <div key={i} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                <div className="h-32 bg-slate-200 flex items-center justify-center text-slate-400">Thumbnail</div>
                                <div className="p-4">
                                    <div className="font-bold text-slate-800 mb-1">Educational Video {i}</div>
                                    <div className="text-xs text-slate-500 mb-3">Channel Name • 12:00</div>
                                    <div className="text-sm text-emerald-600 italic mb-4">"Recommended for your skill level"</div>
                                    <button className="w-full py-2 bg-slate-100 rounded-lg text-sm font-bold hover:bg-slate-200">Watch Now</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Settings = () => (
            <div className="max-w-3xl mx-auto">
                <h1 className="text-3xl font-bold text-slate-800 mb-8">Nexus AI Policy Settings</h1>
                <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 space-y-8">
                    <section>
                        <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center"><i className="fas fa-clock mr-2 text-indigo-500"></i> Schedule</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <input type="time" className="p-2 border rounded-lg bg-slate-50" defaultValue="09:00" />
                            <input type="time" className="p-2 border rounded-lg bg-slate-50" defaultValue="17:00" />
                        </div>
                    </section>
                    <section>
                        <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center"><i className="fas fa-shield-halved mr-2 text-indigo-500"></i> Enforcement</h3>
                        <div className="grid grid-cols-2 gap-4">
                            <select className="p-2 border rounded-lg bg-slate-50"><option>Gentle</option><option selected>Moderate</option><option>Strict</option></select>
                            <select className="p-2 border rounded-lg bg-slate-50"><option selected>Encouraging</option><option>Direct</option><option>Analytical</option></select>
                        </div>
                    </section>
                    <button className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg">Save Changes</button>
                </div>
            </div>
        );

        const Logs = () => (
            <div className="max-w-5xl mx-auto">
                <h1 className="text-3xl font-bold text-slate-800 mb-8">Nexus AI Activity Logs</h1>
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b border-slate-100">
                            <tr>
                                <th className="p-4 text-slate-500 text-sm">Time</th>
                                <th className="p-4 text-slate-500 text-sm">Event</th>
                                <th className="p-4 text-slate-500 text-sm">Transition</th>
                                <th className="p-4 text-slate-500 text-sm">Detail</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr className="border-b border-slate-50">
                                <td className="p-4 text-sm text-slate-600">09:00</td>
                                <td className="p-4"><span className="text-xs font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-700">START</span></td>
                                <td className="p-4 text-sm font-medium text-slate-700">Idle &rarr; Studying</td>
                                <td className="p-4 text-sm text-slate-500 italic">User started session</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const About = () => (
            <div className="max-w-3xl mx-auto">
                <h1 className="text-3xl font-bold text-slate-800 mb-8">About Nexus AI</h1>
                <div className="space-y-8">
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center">
                            <i className="fas fa-bullseye mr-2 text-indigo-500"></i> Core Purpose
                        </h2>
                        <p className="text-lg text-slate-600 mb-6 leading-relaxed">
                            Nexus AI is a privacy-first Windows desktop assistant designed to help learners maintain consistency and eliminate distractions.
                        </p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {[
                                "Detects social-media interruptions",
                                "Understands distraction patterns",
                                "Provides personalized counseling",
                                "Blocks social media when limits exceed",
                                "Supports learning with plans & quizzes",
                                "Local-first data privacy",
                                "Supports Browser & Native Apps"
                            ].map((item, i) => (
                                <div key={i} className="flex items-start gap-3">
                                    <i className="fas fa-check-circle text-emerald-500 mt-1"></i>
                                    <span className="text-slate-700">{item}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center">
                            <i className="fas fa-comments-alt mr-2 text-indigo-500"></i> Counseling System
                        </h2>
                        <div className="space-y-6">
                            <div className="p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                                <p className="text-sm text-indigo-800 leading-relaxed">
                                    Nexus AI employs a <strong className="font-bold">brief, respectful, and practical</strong> counseling approach. It avoids judgment and focuses on helping the learner reset their focus.
                                </p>
                            </div>

                            <div className="relative px-4">
                                <h3 className="font-bold text-slate-800 mb-4 text-sm uppercase tracking-wider">Counseling Workflow:</h3>
                                <div className="space-y-4 relative">
                                    <div className="absolute left-4 top-2 bottom-2 w-0.5 bg-slate-200"></div>
                                    {[
                                        { step: "Identify", desc: "Detect what happened (e.g., App launch)", icon: "fa-search" },
                                        { step: "Intent", desc: "Ask what the learner intended to study", icon: "fa-question" },
                                        { step: "Reset", desc: "Offer a short mental reset", icon: "fa-sync" },
                                        { step: "Step", desc: "Suggest a smaller, achievable next step", icon: "fa-shoe-prints" },
                                        { step: "Fatigue", desc: "Offer a break if fatigue is likely detected", icon: "fa-bed" },
                                        { step: "Decision", desc: "User chooses: Resume, Break, or End Session", icon: "fa-toggle-on" },
                                    ].map((item, i) => (
                                        <div key={i} className="flex items-center gap-4 relative z-10">
                                            <div className="w-8 h-8 rounded-full bg-white border-2 border-indigo-500 flex items-center justify-center text-indigo-500 text-xs">
                                                <i className={`fas ${item.icon}`}></i>
                                            </div>
                                            <div className="bg-white p-3 rounded-lg shadow-sm border border-slate-100 flex-1">
                                                <span className="font-bold text-slate-800 text-sm mr-2">{item.step}:</span>
                                                <span className="text-sm text-slate-600">{item.desc}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                    <h3 className="font-bold text-slate-800 text-sm mb-2">Intelligence Tools:</h3>
                                    <div className="text-xs text-slate-600 space-y-2">
                                        <div className="flex items-center gap-2"><i className="fas fa-check text-indigo-400"></i> Evidence-based coaching patterns</div>
                                        <div className="flex items-center gap-2"><i className="fas fa-check text-indigo-400"></i> Local transformer personalization</div>
                                        <div className="flex items-center gap-2"><i className="fas fa-check text-indigo-400"></i> User-selected tone & language</div>
                                        <div className="flex items-center gap-2"><i className="fas fa-check text-indigo-400"></i> Explicit cloud-content consent</div>
                                    </div>
                                </div>
                                <div className="p-4 bg-rose-50 rounded-xl border border-rose-100">
                                    <h3 className="font-bold text-rose-800 text-sm mb-2">Safety Guardrails:</h3>
                                    <div className="text-xs text-rose-700 space-y-2">
                                        <div className="flex items-center gap-2"><i className="fas fa-ban"></i> No medical/psychological claims</div>
                                        <div className="flex items-center gap-2"><i className="fas fa-phone-alt"></i> Refers severe distress to professionals</div>
                                        <div className="flex items-center gap-2"><i className="fas fa-shield-alt"></i> Escalates only after counseling fails</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center">
                            <i className="fas fa-balance-scale mr-2 text-indigo-500"></i> Reasoning & Decision-Making
                        </h2>
                        <div className="space-y-6">
                            <div>
                                <h3 className="font-bold text-slate-800 mb-3 text-sm uppercase tracking-wider">Decision Inputs:</h3>
                                <div className="grid grid-cols-2 gap-2 text-sm text-slate-600">
                                    {["Current time", "Active study session", "Configured policy", "Recent interruptions", "Previous counseling", "Lock state", "User feedback", "Model confidence", "Safety constraints"].map((item, i) => (
                                        <div key={i} className="flex items-center gap-2">
                                            <i className="fas fa-check text-indigo-300 text-xs"></i> {item}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                <h3 className="font-bold text-slate-800 mb-3 text-sm uppercase tracking-wider">Escalation Path:</h3>
                                <div className="space-y-3">
                                    {[
                                        { step: "1st Interruption", action: "Gentle reminder", icon: "fa-bell" },
                                        { step: "Repeated Use", action: "Explain detected pattern", icon: "fa-chart-line" },
                                        { step: "Continued Use", action: "Personalized counseling", icon: "fa-comments" },
                                        { step: "Post-Counseling", action: "3-hour total lock", icon: "fa-lock" },
                                    ].map((item, i) => (
                                        <div key={i} className="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-100 text-sm">
                                            <span className="font-medium text-slate-700">{item.step}</span>
                                            <i className={`fas ${item.icon} text-indigo-400 mx-3`}></i>
                                            <span className="text-slate-600">{item.action}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="p-4 bg-amber-50 rounded-xl border border-amber-100">
                                    <h3 className="font-bold text-amber-800 text-sm mb-2">Overnight Lock</h3>
                                    <p className="text-xs text-amber-700">Social media is blocked immediately from 11:00 PM to 5:00 AM.</p>
                                </div>
                                <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-100">
                                    <h3 className="font-bold text-emerald-800 text-sm mb-2">Emergency Unlock</h3>
                                    <p className="text-xs text-emerald-700">Allowed only if safety conditions are met; all unlocks are logged.</p>
                                </div>
                            </div>

                            <div className="p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                                <h3 className="font-bold text-indigo-800 text-sm mb-2">Decision Transparency:</h3>
                                <p className="text-xs text-indigo-700 italic">
                                    Every decision includes an internal explanation (e.g., "Three launches occurred after two reminders"). Low-confidence AI results always fall back to conservative deterministic rules.
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center">
                            <i className="fas fa-microchip mr-2 text-indigo-500"></i> Transformer-Based Understanding
                        </h2>
                        <div className="space-y-6">
                            <div>
                                <h3 className="font-bold text-slate-800 mb-3 text-sm uppercase tracking-wider">Core Intelligence:</h3>
                                <p className="text-sm text-slate-600 mb-4">
                                    Nexus AI utilizes a small local transformer model via <span className="font-bold">ONNX Runtime</span> to ensure that all understanding and inference stay on your device.
                                </p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {[
                                        "Classify interruption context",
                                        "Identify repeated distraction patterns",
                                        "Summarize study progress",
                                        "Detect counseling acknowledgment",
                                        "Generate personalized explanations",
                                        "Adapt to learner's language & level",
                                        "Rank educational resources"
                                    ].map((item, i) => (
                                        <div key={i} className="flex items-center gap-3 p-2 bg-slate-50 rounded-lg text-slate-700 text-sm border border-slate-100">
                                            <i className="fas fa-bolt text-amber-400"></i> {item}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="p-4 bg-rose-50 rounded-xl border border-rose-100">
                                <h3 className="font-bold text-rose-800 text-sm mb-2 flex items-center">
                                    <i className="fas fa-ban mr-2"></i> AI Safety Guardrails:
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs text-rose-700">
                                    {[
                                        "Cannot diagnose mental-health conditions",
                                        "Cannot make irreversible decisions",
                                        "No access to private content",
                                        "Cannot override safety controls",
                                        "Cannot control enforcement independently"
                                    ].map((item, i) => (
                                        <div key={i} className="flex items-center gap-2">
                                            <i className="fas fa-times-circle"></i> {item}
                                        </div>
                                    ))}
                                </div>
                                <p className="mt-4 text-xs text-rose-600 italic font-medium">
                                    Nexus AI uses deterministic rules for enforcement and the transformer exclusively for understanding and personalization.
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center">
                            <i className="fas fa-user-shield mr-2 text-indigo-500"></i> Privacy & Data Protection
                        </h2>
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {[
                                    "Local-first storage for all activity",
                                    "Full database encryption (SQLCipher)",
                                    "Append-only records for accountability",
                                    "No recording of passwords or keystrokes",
                                    "Minimum data collection (domain/timestamp)",
                                    "No default cloud AI transmission",
                                    "Payload transparency before cloud use",
                                    "Local model inference by default"
                                ].map((item, i) => (
                                    <div key={i} className="flex items-center gap-3 p-3 bg-slate-50 rounded-lg text-slate-700 text-sm border border-slate-100">
                                        <i className="fas fa-lock text-indigo-400"></i> {item}
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                                <h3 className="font-bold text-indigo-800 text-sm mb-2">Transparent Reasoning:</h3>
                                <p className="text-sm text-indigo-700 italic">
                                    Nexus AI clearly distinguishes between observed activity, inferred conclusions, autonomous decisions, and final actions.
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center">
                            <i className="fas fa-brain mr-2 text-indigo-500"></i> Cognitive Memory System
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="space-y-3">
                                <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wider">Profile Memory</h3>
                                <div className="text-sm text-slate-600 space-y-1">
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> Preferred Language</div>
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> Learning Goals & Subjects</div>
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> Skill Level & Accessibility</div>
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> Study Times & Preferences</div>
                                </div>
                            </div>
                            <div className="space-y-3">
                                <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wider">Episodic Memory</h3>
                                <div className="text-sm text-slate-600 space-y-1">
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> Study Session Logs</div>
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> Interruption & Lock Events</div>
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> Counseling Interactions</div>
                                    <div className="flex items-center gap-2"><i className="fas fa-caret-right text-indigo-300"></i> User Feedback Records</div>
                                </div>
                            </div>
                            <div className="space-y-3">
                                <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wider">Semantic Memory</h3>
                                <div className="text-sm text-slate-600 space-y-1">
