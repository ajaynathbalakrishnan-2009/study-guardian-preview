<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Guardian Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Dashboard = () => {
            const [state, setState] = useState('Idle');
            const [time, setTime] = useState(0);

            useEffect(() => {
                let interval;
                if (state === 'Studying') {
                    interval = setInterval(() => setTime(t => t + 1), 1000);
                }
                return () => clearInterval(interval);
            }, [state]);

            const formatTime = (s) => {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return `${m}:${sec.toString().padStart(2, '0')}`;
            };

            return (
                <div class="max-w-4xl mx-auto text-center">
                    <h1 class="text-3xl font-bold text-slate-800 mb-8">Study Dashboard</h1>

                    <div class="bg-white p-12 rounded-3xl shadow-xl inline-block min-w-[400px] border border-slate-100">
                        <div class="text-lg text-slate-500 mb-2">
                            Current Status: <span class="font-bold text-indigo-600">{state}</span>
                        </div>
                        <div class="text-7xl font-black mb-8 text-slate-800 tabular-nums">
                            {formatTime(time)}
                        </div>

                        {state === 'Idle' ? (
                            <button
                                onClick={() => setState('Studying')}
                                class="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-4 rounded-full text-xl font-bold transition-all transform hover:scale-105 shadow-lg"
                            >
                                <i class="fas fa-play mr-2"></i> Start Study Session
                            </button>
                        ) : (
                            <button
                                onClick={() => { setState('Idle'); setTime(0); }}
                                class="bg-rose-500 hover:bg-rose-600 text-white px-8 py-4 rounded-full text-xl font-bold transition-all transform hover:scale-105 shadow-lg"
                            >
                                <i class="fas fa-stop mr-2"></i> End Session
                            </button>
                        )}
                    </div>

                    <div class="grid grid-cols-2 gap-6 mt-12 text-left">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="text-slate-500 font-medium mb-2">Daily Social Media Limit</h3>
                            <div class="text-3xl font-bold text-slate-800">45 / 60 min</div>
                            <div class="w-full bg-slate-100 h-3 rounded-full mt-4 overflow-hidden">
                                <div class="bg-indigo-500 h-full w-[75%] rounded-full"></div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="text-slate-500 font-medium mb-2">Weekly Focus Score</h3>
                            <div class="text-3xl font-bold text-slate-800">88%</div>
                            <p class="text-slate-400 text-sm mt-2">↑ 4% from last week</p>
                        </div>
                    </div>
                </div>
            );
        };

        const Settings = () => {
            return (
                <div class="max-w-3xl mx-auto">
                    <h1 class="text-3xl font-bold text-slate-800 mb-8">Policy Settings</h1>
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 space-y-8">
                        <section>
                            <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
                                <i class="fas fa-clock mr-2 text-indigo-500"></i> Study Schedule
                            </h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-sm text-slate-500 block mb-1">Start Time</label>
                                    <input type="time" class="w-full p-2 border rounded-lg bg-slate-50" defaultValue="09:00" />
                                </div>
                                <div>
                                    <label class="text-sm text-slate-500 block mb-1">End Time</label>
                                    <input type="time" class="w-full p-2 border rounded-lg bg-slate-50" defaultValue="17:00" />
                                </div>
                            </div>
                        </section>

                        <section>
                            <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
                                <i class="fas fa-shield-halved mr-2 text-indigo-500"></i> Enforcement Style
                            </h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-sm text-slate-500 block mb-1">Strictness</label>
                                    <select class="w-full p-2 border rounded-lg bg-slate-50">
                                        <option>Gentle</option>
                                        <option selected>Moderate</option>
                                        <option>Strict</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-sm text-slate-500 block mb-1">Counseling Tone</label>
                                    <select class="w-full p-2 border rounded-lg bg-slate-50">
                                        <option selected>Encouraging</option>
                                        <option>Direct</option>
                                        <option>Analytical</option>
                                    </select>
                                </div>
                            </div>
                        </section>

                        <section>
                            <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
                                <i class="fas fa-list-check mr-2 text-indigo-500"></i> App Whitelist
                            </h3>
                            <textarea
                                class="w-full p-3 border rounded-lg bg-slate-50 h-24"
                                placeholder="Enter approved apps (comma separated)..."
                                defaultValue="Notion, Obsidian, VS Code, Zotero"
                            ></textarea>
                        </section>

                        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-200">
                            Save Policy Changes
                        </button>
                    </div>
                </div>
            );
        };

        const Logs = () => {
            const logs = [
                { time: '09:00', event: 'SESSION_START', trans: 'Idle → Studying', detail: 'User clicked start', type: 'info' },
                { time: '09:15', event: 'DISTRACTION', trans: 'Studying → Interrupted', detail: 'Facebook.com accessed', type: 'warning' },
                { time: '09:16', event: 'RESUME', trans: 'Interrupted → Studying', detail: 'Reminder acknowledged', type: 'success' },
                { time: '10:00', event: 'SESSION_END', trans: 'Studying → Idle', detail: 'Manual end', type: 'info' },
            ];

            return (
                <div class="max-w-5xl mx-auto">
                    <h1 class="text-3xl font-bold text-slate-800 mb-8">Activity Logs</h1>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b border-slate-100">
                                <tr>
                                    <th class="p-4 text-slate-500 font-medium text-sm">Timestamp</th>
                                    <th class="p-4 text-slate-500 font-medium text-sm">Event</th>
                                    <th class="p-4 text-slate-500 font-medium text-sm">Transition</th>
                                    <th class="p-4 text-slate-500 font-medium text-sm">Detail</th>
                                </tr>
                            </thead>
                            <tbody>
                                {logs.map((log, i) => (
                                    <tr key={i} class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                        <td class="p-4 text-sm text-slate-600">{log.time}</td>
                                        <td class="p-4">
                                            <span class={`text-xs font-bold px-2 py-1 rounded-full ${
                                                log.type === 'warning' ? 'bg-amber-100 text-amber-700' :
                                                log.type === 'success' ? 'bg-emerald-100 text-emerald-700' :
                                                'bg-blue-100 text-blue-700'
                                            }`}>
                                                {log.event}
                                            </span>
                                        </td>
                                        <td class="p-4 text-sm font-medium text-slate-700">{log.trans}</td>
                                        <td class="p-4 text-sm text-slate-500 italic">{log.detail}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [tab, setTab] = useState('dashboard');

            return (
                <div class="flex h-screen">
                    <aside class="w-64 bg-slate-900 text-white flex flex-col p-6">
                        <div class="flex items-center gap-3 mb-12">
                            <div class="bg-indigo-500 p-2 rounded-lg">
                                <i class="fas fa-graduation-cap text-white"></i>
                            </div>
                            <h2 class="text-xl font-bold tracking-tight">Nexus AI Guardian</h2>
                        </div>

                        <nav class="flex flex-col gap-2">
                            <button
                                onClick={() => setTab('dashboard')}
                                class={`flex items-center gap-3 p-3 rounded-xl transition-all ${tab === 'dashboard' ? 'bg-indigo-600 shadow-lg shadow-indigo-900' : 'hover:bg-slate-800 text-slate-400'}`}
                            >
                                <i class="fas fa-chart-pie"></i> Dashboard
                            </button>
                            <button
                                onClick={() => setTab('settings')}
                                class={`flex items-center gap-3 p-3 rounded-xl transition-all ${tab === 'settings' ? 'bg-indigo-600 shadow-lg shadow-indigo-900' : 'hover:bg-slate-800 text-slate-400'}`}
                            >
                                <i class="fas fa-sliders"></i> Policy Settings
                            </button>
                            <button
                                onClick={() => setTab('logs')}
                                class={`flex items-center gap-3 p-3 rounded-xl transition-all ${tab === 'logs' ? 'bg-indigo-600 shadow-lg shadow-indigo-900' : 'hover:bg-slate-800 text-slate-400'}`}
                            >
                                <i class="fas fa-history"></i> Activity Logs
                            </button>
                        </nav>

                        <div class="mt-auto p-4 bg-slate-800 rounded-2xl text-xs text-slate-400">
                            <p class="font-bold mb-1 text-slate-300">Privacy Mode: Active</p>
                            <p>Data stored locally via SQLCipher</p>
                        </div>
                    </aside>

                    <main class="flex-1 overflow-y-auto p-12">
                        {tab === 'dashboard' && <Dashboard />}
                        {tab === 'settings' && <Settings />}
                        {tab === 'logs' && <Logs />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
