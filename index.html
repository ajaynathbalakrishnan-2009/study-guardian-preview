<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Guardian Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Dashboard = () => {
            const [state, setState] = useState('Idle');
            const [time, setTime] = useState(0);

            useEffect(() => {
                let interval;
                if (state === 'Studying') {
                    interval = setInterval(() => setTime(t => t + 1), 1000);
                }
                return () => clearInterval(interval);
            }, [state]);

            const formatTime = (s) => {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return `${m}:${sec.toString().padStart(2, '0')}`;
            };

            return (
                <div class="max-w-4xl mx-auto text-center">
                    <h1 class="text-3xl font-bold text-slate-800 mb-8">Nexus AI Study Dashboard</h1>
                    <div class="bg-white p-12 rounded-3xl shadow-xl inline-block min-w-[400px] border border-slate-100">
                        <div class="text-lg text-slate-500 mb-2">
                            Current Status: <span class="font-bold text-indigo-600">{state}</span>
                        </div>
                        <div class="text-7xl font-black mb-8 text-slate-800 tabular-nums">{formatTime(time)}</div>
                        {state === 'Idle' ? (
                            <button onClick={() => setState('Studying')} class="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-4 rounded-full text-xl font-bold transition-all transform hover:scale-105 shadow-lg">
                                <i class="fas fa-play mr-2"></i> Start Study Session
                            </button>
                        ) : (
                            <button onClick={() => { setState('Idle'); setTime(0); }} class="bg-rose-500 hover:bg-rose-600 text-white px-8 py-4 rounded-full text-xl font-bold transition-all transform hover:scale-105 shadow-lg">
                                <i class="fas fa-stop mr-2"></i> End Session
                            </button>
                        )}
                    </div>
                    <div class="grid grid-cols-2 gap-6 mt-12 text-left">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="text-slate-500 font-medium mb-2">Daily Social Media Limit</h3>
                            <div class="text-3xl font-bold text-slate-800">45 / 60 min</div>
                            <div class="w-full bg-slate-100 h-3 rounded-full mt-4 overflow-hidden">
                                <div class="bg-indigo-500 h-full w-[75%] rounded-full"></div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="text-slate-500 font-medium mb-2">Weekly Focus Score</h3>
                            <div class="text-3xl font-bold text-slate-800">88%</div>
                            <p class="text-slate-400 text-sm mt-2">↑ 4% from last week</p>
                        </div>
                    </div>
                </div>
            );
        };

        const Planner = () => {
            const [tasks, setTasks] = useState([
                { id: 1, subject: 'Math', task: 'Calculus Exercises', completed: false, diff: 'Hard' },
                { id: 2, subject: 'CS', task: 'Red-Black Tree', completed: true, diff: 'Medium' },
            ]);
            return (
                <div class="max-w-3xl mx-auto">
                    <h1 class="text-3xl font-bold text-slate-800 mb-8">Nexus AI Study Planner</h1>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
                        <div class="flex gap-4">
                            <input class="flex-1 p-2 border rounded-lg" placeholder="Subject" />
                            <input class="flex-[2] p-2 border rounded-lg" placeholder="Task" />
                            <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold">Add</button>
                        </div>
                    </div>
                    <div class="space-y-3">
                        {tasks.map(t => (
                            <div key={t.id} class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-indigo-500 flex items-center justify-between">
                                <div>
                                    <span class="text-xs font-bold text-slate-400 mr-2 uppercase">{t.subject}</span>
                                    <span class={t.completed ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}>{t.task}</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-600">{t.diff}</span>
                                    <input type="checkbox" checked={t.completed} readOnly class="w-5 h-5" />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Quiz = () => {
            return (
                <div class="max-w-2xl mx-auto text-center">
                    <h1 class="text-3xl font-bold text-slate-800 mb-8">Nexus AI Knowledge Check</h1>
                    <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                        <div class="text-sm text-slate-400 mb-4">Question 1 of 3</div>
                        <h2 class="text-xl font-bold text-slate-700 mb-6">What is the time complexity of searching in a Balanced BST?</h2>
                        <div class="grid grid-cols-1 gap-3">
                            {['O(1)', 'O(log n)', 'O(n)', 'O(n log n)'].map(opt => (
                                <button key={opt} class="p-4 text-left border rounded-xl hover:bg-indigo-50 transition-colors">{opt}</button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Recs = () => {
            return (
                <div class="max-w-4xl mx-auto">
                    <h1 class="text-3xl font-bold text-slate-800 mb-8">Nexus AI Learning Resources</h1>
                    <div class="grid grid-cols-2 gap-6">
                        {[1,2,3,4].map(i => (
                            <div key={i} class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                <div class="h-32 bg-slate-200 flex items-center justify-center text-slate-400">Thumbnail</div>
                                <div class="p-4">
                                    <div class="font-bold text-slate-800 mb-1">Educational Video {i}</div>
                                    <div class="text-xs text-slate-500 mb-3">Channel Name • 12:00</div>
                                    <div class="text-sm text-emerald-600 italic mb-4">"Recommended for your skill level"</div>
                                    <button class="w-full py-2 bg-slate-100 rounded-lg text-sm font-bold hover:bg-slate-200">Watch Now</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Settings = () => (
            <div class="max-w-3xl mx-auto">
                <h1 class="text-3xl font-bold text-slate-800 mb-8">Nexus AI Policy Settings</h1>
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 space-y-8">
                    <section>
                        <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center"><i class="fas fa-clock mr-2 text-indigo-500"></i> Schedule</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="time" class="p-2 border rounded-lg bg-slate-50" defaultValue="09:00" />
                            <input type="time" class="p-2 border rounded-lg bg-slate-50" defaultValue="17:00" />
                        </div>
                    </section>
                    <section>
                        <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center"><i class="fas fa-shield-halved mr-2 text-indigo-500"></i> Enforcement</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <select class="p-2 border rounded-lg bg-slate-50"><option>Gentle</option><option selected>Moderate</option><option>Strict</option></select>
                            <select class="p-2 border rounded-lg bg-slate-50"><option selected>Encouraging</option><option>Direct</option><option>Analytical</option></select>
                        </div>
                    </section>
                    <button class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg">Save Changes</button>
                </div>
            </div>
        );

        const Logs = () => (
            <div class="max-w-5xl mx-auto">
                <h1 class="text-3xl font-bold text-slate-800 mb-8">Nexus AI Activity Logs</h1>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b border-slate-100">
                            <tr>
                                <th class="p-4 text-slate-500 text-sm">Time</th>
                                <th class="p-4 text-slate-500 text-sm">Event</th>
                                <th class="p-4 text-slate-500 text-sm">Transition</th>
                                <th class="p-4 text-slate-500 text-sm">Detail</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b border-slate-50">
                                <td class="p-4 text-sm text-slate-600">09:00</td>
                                <td class="p-4"><span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-700">START</span></td>
                                <td class="p-4 text-sm font-medium text-slate-700">Idle &rarr; Studying</td>
                                <td class="p-4 text-sm text-slate-500 italic">User started session</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const About = () => (
            <div class="max-w-3xl mx-auto">
                <h1 class="text-3xl font-bold text-slate-800 mb-8">About Nexus AI</h1>
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-lg text-slate-600 mb-6 leading-relaxed">
                        Nexus AI is a privacy-first Windows desktop assistant designed to help learners maintain consistency and eliminate distractions.
                    </p>
                    <div class="space-y-4">
                        {[
                            "Detects social-media interruptions in real-time",
                            "Understands study and distraction patterns using local AI",
                            "Provides personalized, respectful counseling",
                            "Blocks social media when limits are exceeded",
                            "Supports learning with plans, explanations, quizzes, and educational videos",
                            "Operates locally to ensure total data privacy",
                            "Supports both web browsers and native Windows applications"
                        ].map((item, i) => (
                            <div key={i} class="flex items-start gap-3">
                                <i class="fas fa-check-circle text-emerald-500 mt-1"></i>
                                <span class="text-slate-700">{item}</span>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [tab, setTab] = useState('dashboard');
            return (
                <div class="flex h-screen">
                    <aside class="w-64 bg-slate-900 text-white flex flex-col p-6">
                        <div class="flex items-center gap-3 mb-12">
                            <div class="bg-indigo-500 p-2 rounded-lg"><i class="fas fa-graduation-cap text-white"></i></div>
                            <h2 class="text-xl font-bold tracking-tight">Nexus AI Guardian</h2>
                        </div>
                        <nav class="flex flex-col gap-2">
                            {[
                                {id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard'},
                                {id: 'planner', icon: 'fa-list-check', label: 'Study Planner'},
                                {id: 'quiz', icon: 'fa-lightbulb', label: 'Knowledge Check'},
                                {id: 'recs', icon: 'fa-video', label: 'Resources'},
                                {id: 'settings', icon: 'fa-sliders', label: 'Policy Settings'},
                                {id: 'logs', icon: 'fa-history', label: 'Activity Logs'},
                                {id: 'about', icon: 'fa-info-circle', label: 'About Nexus AI'},
                            ].map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setTab(item.id)}
                                    class={`flex items-center gap-3 p-3 rounded-xl transition-all ${tab === item.id ? 'bg-indigo-600 shadow-lg shadow-indigo-900' : 'hover:bg-slate-800 text-slate-400'}`}
                                >
                                    <i class={`fas ${item.icon}`}></i> {item.label}
                                </button>
                            ))}
                        </nav>
                        <div class="mt-auto p-4 bg-slate-800 rounded-2xl text-xs text-slate-400">
                            <p class="font-bold mb-1 text-slate-300">Privacy Mode: Active</p>
                            <p>Data stored locally via SQLCipher</p>
                        </div>
                    </aside>
                    <main class="flex-1 overflow-y-auto p-12">
                        {tab === 'dashboard' && <Dashboard />}
                        {tab === 'planner' && <Planner />}
                        {tab === 'quiz' && <Quiz />}
                        {tab === 'recs' && <Recs />}
                        {tab === 'settings' && <Settings />}
                        {tab === 'logs' && <Logs />}
                        {tab === 'about' && <About />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
